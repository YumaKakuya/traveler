name: Traveler. CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pmoqa-tests:
    name: PmoQa unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure test build
        run: xmake config -m release --with_llama=n --asm_hot_paths=n -y

      - name: Build PmoQa unit test targets
        run: |
          xmake build -v test_roles
          xmake build -v test_safety_corpus
          xmake build -v test_safety_queue
          xmake build -v test_safety_redact
          xmake build -v test_safety_backtrack
          xmake build -v test_safety_jsonl
          xmake build -v test_safety_benchmark
          xmake build -v test_safety_budget
          xmake build -v test_cockpit
          xmake build -v test_adapters_corpus
          xmake build -v test_editor
          xmake build -v test_pane_command
          xmake build -v test_git_mode
          xmake build -v test_llm_mode
          xmake build -v test_tui_surface
          xmake build -v test_ayane_download
          xmake build -v test_offline_mode
          xmake build -v test_llamacpp_adapter_state

      - name: Run PmoQa unit tests
        run: |
          xmake run test_roles
          xmake run test_safety_corpus
          xmake run test_safety_queue
          xmake run test_safety_redact
          xmake run test_safety_backtrack
          xmake run test_safety_jsonl
          xmake run test_safety_benchmark
          xmake run test_safety_budget
          xmake run test_cockpit
          xmake run test_adapters_corpus
          xmake run test_editor
          xmake run test_pane_command
          xmake run test_git_mode
          xmake run test_llm_mode
          xmake run test_tui_surface
          xmake run test_ayane_download
          xmake run test_offline_mode
          xmake run test_llamacpp_adapter_state

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.build }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - primary with-llama build.
          - { os: ubuntu-latest, arch: x86_64, build: with-llama, runner: ubuntu-latest, xmake_arch: "" }
          # Linux arm64 - requires GitHub-hosted ARM runner (ubuntu-24.04-arm).
          - { os: ubuntu-24.04-arm, arch: arm64, build: with-llama, runner: ubuntu-24.04-arm, xmake_arch: "" }
          # macOS x86_64 target built on macOS arm64 runner to avoid Intel runner starvation.
          - { os: macos-14, arch: x86_64, build: with-llama, runner: macos-14, xmake_arch: x86_64 }
          # macOS arm64 target.
          - { os: macos-14, arch: arm64, build: with-llama, runner: macos-14, xmake_arch: arm64 }
          # Windows native build remains release evidence. It is not a PR test gate
          # until PmoQa has a reachable Windows test/build asset for this branch.
          # Linux without-llama smoke check.
          - { os: ubuntu-latest, arch: x86_64, build: without-llama, runner: ubuntu-latest, xmake_arch: "" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        shell: bash
        run: |
          arch_arg=""
          plat_arg=""
          if [ -n "${{ matrix.xmake_arch }}" ]; then
            arch_arg="--arch=${{ matrix.xmake_arch }}"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Git Bash defaults xmake to `mingw`; use the native Windows toolchain.
            plat_arg="-p windows"
          fi
          if [ "${{ matrix.build }}" = "without-llama" ]; then
            xmake config $plat_arg -m release $arch_arg --with_llama=n --asm_hot_paths=n -y
          else
            xmake config $plat_arg -m release $arch_arg --with_llama=y --asm_hot_paths=n -y
          fi

      - name: Build traveler binary
        run: xmake build -v traveler

      - name: Version smoke (traveler --version)
        shell: bash
        run: |
          # Locate the built binary and assert the version string.
          BIN=$(find build -name traveler -type f | head -1)
          echo "Found binary: $BIN"
          "$BIN" --version 2>&1 | grep -q "Traveler. v0.1.0-alpha" || {
            echo "ERROR: version string mismatch"
            "$BIN" --version 2>&1
            exit 1
          }
          echo "Version smoke PASS"

      - name: License audit (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/license_audit.sh

      - name: License audit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/license_audit.ps1

      - name: Upload binary artefact
        if: matrix.build == 'with-llama'
        uses: actions/upload-artifact@v4
        with:
          name: traveler-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/**/release/traveler
            build/**/release/traveler.exe
