name: Phase-0 External PR Guard

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate PR author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          ALLOWED="sorted-ai-bot YumaKakuya"
          if echo "$ALLOWED" | grep -qw "$PR_AUTHOR"; then
            echo "Internal author '$PR_AUTHOR' — no action."
            exit 0
          fi
          echo "External author '$PR_AUTHOR' — closing PR #$PR_NUMBER."
          gh pr close "$PR_NUMBER" --comment "Phase-0 PRs closed. During the Phase 0 two-week window, external feature and architecture PRs are closed. Please see CONTRIBUTING.md for details. Bug fixes and documentation improvements may be considered after Phase 0."
